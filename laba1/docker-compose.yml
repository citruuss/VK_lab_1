version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: lakekeeper
      POSTGRES_PASSWORD: lakekeeper
      POSTGRES_DB: lakekeeper
    ports:
      - "5432:5432"

  lakekeeper:
    image: ghcr.io/lakekeeper/lakekeeper:latest
    container_name: lakekeeper
    environment:
      LAKEKEEPER__STORAGE__TYPE: s3
      LAKEKEEPER__STORAGE__S3__ENDPOINT: http://minio:9000
      LAKEKEEPER__STORAGE__S3__ACCESS_KEY: admin
      LAKEKEEPER__STORAGE__S3__SECRET_KEY: password123
      LAKEKEEPER__STORAGE__S3__BUCKET: lakehouse
      LAKEKEEPER__STORAGE__S3__REGION: us-east-1
      LAKEKEEPER__DATABASE__URL: postgresql://lakekeeper:lakekeeper@postgres:5432/lakekeeper
    ports:
      - "8181:8181"
    depends_on:
      - postgres
      - minio

  trino:
    image: trinodb/trino:430
    container_name: trino
    ports:
      - "8080:8080"
    volumes:
      - ./trino-catalog:/etc/trino/catalog
    depends_on:
      - lakekeeper

  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    ports:
      - "3000:3000"
    depends_on:
      - trino

volumes:
  minio_data: